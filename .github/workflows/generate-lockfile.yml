# One-shot helper: lets npm write package-lock.json inside the repo, so the
# lockfile is generated by npm rather than typed by hand. Removed once the file
# is committed.

name: Generate lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate package-lock.json
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Commit the lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already up to date"
            exit 0
          fi
          git commit -m "Add package-lock.json"
          git push
