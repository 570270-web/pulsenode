# Deploy the pulsenode Worker on every push to main.
#
# Note: the Cloudflare dashboard also runs its own Workers Build (Git
# integration) on push. Use one of them, or a push deploys twice.
#
# One-time setup (repo → Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token with the "Edit Cloudflare Workers" template
#                          (Workers Scripts:Edit, D1:Edit for the first deploy)
#   CLOUDFLARE_ACCOUNT_ID  the account id from the Cloudflare dashboard URL
#
# The D1 binding in wrangler.jsonc has no database_id, so the first deploy
# creates the `pulsenode` database and later deploys inherit it.

name: Deploy Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race for the same Worker.
concurrency:
  group: deploy-worker-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins and fails if the
      # lockfile and package.json disagree, which is the point of keeping it.
      - name: Install dependencies
        run: npm ci

      # esbuild bundles worker/index.js (plus the shared modules in src/) into
      # dist/worker.js, which is the file wrangler.jsonc points at.
      - name: Build Worker bundle
        run: npm run build:worker

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          # @v3 installs Wrangler 3.90.0 by default, which cannot read
          # wrangler.jsonc (supported from 3.91.0) and fails with
          # "Missing entry-point". Pin Wrangler 4 explicitly.
          wranglerVersion: "4"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
