# Manual deploy of the pulsenode Worker.
#
# Deployments normally come from the Cloudflare Workers Builds Git integration,
# which runs `npx wrangler deploy` on every push to main. That deploy step
# compiles dist/worker.js itself via `build.command` in wrangler.jsonc, so this
# workflow neither needs nor triggers on push: it only exists as a fallback you
# run by hand from the Actions tab (Run workflow).
#
# One-time setup (repo → Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token with the "Edit Cloudflare Workers" template
#                          (Workers Scripts:Edit, D1:Edit for the first deploy)
#   CLOUDFLARE_ACCOUNT_ID  the account id from the Cloudflare dashboard URL

name: Deploy Worker (manual)

on:
  workflow_dispatch:

# Never let two deploys race for the same Worker.
concurrency:
  group: deploy-worker-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins and fails if the
      # lockfile and package.json disagree. Wrangler needs esbuild from here
      # because `wrangler deploy` runs `npm run build:worker` (wrangler.jsonc's
      # `build.command`) to bundle dist/worker.js before uploading.
      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          # @v3 installs Wrangler 3.90.0 by default, which cannot read
          # wrangler.jsonc (supported from 3.91.0) and fails with
          # "Missing entry-point". Pin Wrangler 4 explicitly.
          wranglerVersion: "4"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
